name: build

on:
  push:
    branches: [main, peano-lab]
  pull_request:
  workflow_dispatch:

jobs:
  book:
    name: Knowledge book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build JupyterBook
        run: jupyter-book build book/ --warningiserror --keep-going
      - name: Replay every lab command referenced in the book
        run: python3 scripts/verify_book_commands.py
      - uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/_build/html

  lean:
    name: Lean artifact (sorry-free, no axioms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: artifacts/lean
        run: lake build
      - name: Axiom check
        working-directory: artifacts/lean
        run: |
          printf 'import Artifacts\nopen Artifacts Artifacts.Sqrt2\n#print axioms add_comm'"'"'\n#print axioms s_combinator\n#print axioms no_sqrt2\n' > /tmp/check.lean
          lake env lean /tmp/check.lean | tee /tmp/out.txt
          if grep -q sorryAx /tmp/out.txt; then echo "FAIL: sorryAx present"; exit 1; fi
          grep -q "does not depend on any axioms" /tmp/out.txt

  lean-fta:
    name: Lean FTA companion (sorry-free, audited axioms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and build FTA
        working-directory: artifacts/lean-fta
        run: |
          lake update
          lake exe cache get
          lake build
      - name: Reject admissions and audit exact standard axioms
        run: python3 scripts/verify_lean_fta.py

  lab-engine:
    name: Lambda Lab engine regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the semantic regression / property suite
        working-directory: lab-lambda/py
        run: python -m unittest discover -s tests -v

  peano-lab-shards:
    name: Peano Lab shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          # Paired-evaluation provenance re-hashes source blobs at its pinned
          # historical producer commit; a depth-1 checkout cannot supply them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Peano Lab shard ${{ matrix.shard }}
        working-directory: peano-lab/py
        run: >-
          python ci_shard.py
          --count 8
          --index ${{ matrix.shard }}
          --
          -q
          --durations=20

  peano-lab:
    name: Peano Lab kernel, engine, UI, and browser contracts
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [peano-lab-shards, peano-kernel-shadow]
    steps:
      - name: Require every Python shard and the native shadow
        env:
          SHARD_RESULT: ${{ needs.peano-lab-shards.result }}
          SHADOW_RESULT: ${{ needs.peano-kernel-shadow.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more Peano Lab shards failed: $SHARD_RESULT"
            exit 1
          fi
          if [ "$SHADOW_RESULT" != "success" ]; then
            echo "The native Rust shadow failed: $SHADOW_RESULT"
            exit 1
          fi

  peano-kernel-shadow:
    name: Peano native Rust shadow (never QED authority)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting
        working-directory: peano-lab/rust/peano-kernel-shadow
        run: cargo fmt --all -- --check
      - name: Lint every native target
        working-directory: peano-lab/rust/peano-kernel-shadow
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test the strict codec, checker, and process boundary
        working-directory: peano-lab/rust/peano-kernel-shadow
        run: cargo test --all-targets --all-features --locked
      - name: Repeat the Rust suite with release arithmetic
        working-directory: peano-lab/rust/peano-kernel-shadow
        run: cargo test --release --all-targets --all-features --locked
      - name: Build the release shadow CLI
        working-directory: peano-lab/rust/peano-kernel-shadow
        run: cargo build --release --locked --bin peano-kernel-shadow
      - name: Differentially replay a tiny and a Cut-bearing theorem
        run: >-
          python3 scripts/differential_peano_kernel_shadow.py
          --rust-cli peano-lab/rust/peano-kernel-shadow/target/release/peano-kernel-shadow
          --theorem zero_add
          --theorem add_comm

  rocq:
    name: Rocq artifacts (statements 1–5, incl. √2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq/Rocq
        run: sudo apt-get update && sudo apt-get install -y coq
      - name: Compile
        working-directory: artifacts/rocq
        run: |
          coqc Artifacts.v
          coqc Sqrt2.v

  agda:
    name: Agda artifact (statements 1–4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda
        run: sudo apt-get update && sudo apt-get install -y agda
      - name: Type-check
        working-directory: artifacts/agda
        run: agda Artifacts.agda
