<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">K3C list-interface dependency spine</title>
  <desc id="description">Previously checked K3B list representation supports two conservative definitions, validity and membership theorem APIs, a semantic lookup interface, and the next append and restriction gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="notation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e22ce"/>
    </marker>
    <style>
      .label { font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172554; text-anchor: middle; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .stable { fill: #dcfce7; stroke: #15803d; stroke-width: 2.5; }
      .definition { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; }
      .alpha { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .future { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .proof-edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .notation-edge { fill: none; stroke: #7e22ce; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#notation-arrow); }
      .future-edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <path class="notation-edge" d="M 220 225 C 255 225, 250 110, 300 110"/>
  <path class="notation-edge" d="M 220 275 C 255 275, 250 390, 300 390"/>
  <path class="proof-edge" d="M 220 235 C 320 220, 355 190, 430 150"/>
  <path class="proof-edge" d="M 220 265 C 320 280, 355 310, 430 350"/>
  <path class="proof-edge" d="M 220 250 C 385 250, 500 250, 650 250"/>
  <path class="notation-edge" d="M 420 110 C 435 110, 440 130, 455 140"/>
  <path class="notation-edge" d="M 420 390 C 435 390, 440 370, 455 360"/>
  <path class="future-edge" d="M 880 250 L 990 250"/>

  <rect class="stable" x="30" y="195" width="190" height="110" rx="4"/>
  <text class="label" x="125" y="232">K3B checked use</text>
  <text class="small" x="125" y="260">Cell · CellListLen</text>
  <text class="small" x="125" y="282">ListAt</text>

  <polygon class="definition" points="300,70 400,70 430,110 400,150 300,150 270,110"/>
  <text class="label" x="350" y="106">CellListValid</text>
  <text class="small" x="350" y="129">hides length</text>

  <polygon class="definition" points="300,350 400,350 430,390 400,430 300,430 270,390"/>
  <text class="label" x="350" y="386">ListMember</text>
  <text class="small" x="350" y="409">hides index</text>

  <rect class="alpha" x="455" y="100" width="155" height="100" rx="14"/>
  <text class="label" x="532" y="138">Validity API</text>
  <text class="small" x="532" y="163">construct · cases</text>
  <text class="small" x="532" y="183">tail elimination</text>

  <rect class="alpha" x="455" y="300" width="155" height="100" rx="14"/>
  <text class="label" x="532" y="338">Membership API</text>
  <text class="small" x="532" y="363">head · tail · iff</text>
  <text class="small" x="532" y="383">transport</text>

  <rect class="alpha" x="700" y="180" width="180" height="140" rx="14"/>
  <text class="label" x="790" y="220">Semantic lookup</text>
  <text class="small" x="790" y="248">existence + uniqueness</text>
  <text class="small" x="790" y="272">extensional equality</text>
  <text class="small" x="790" y="296">unique decomposition</text>

  <rect class="future" x="990" y="195" width="180" height="110" rx="14"/>
  <text class="label" x="1080" y="232">Planned next gate</text>
  <text class="small" x="1080" y="260">append</text>
  <text class="small" x="1080" y="282">prefix restriction</text>

  <line x1="30" y1="465" x2="75" y2="465" class="proof-edge"/>
  <text class="small" x="150" y="470">grouped support flow</text>
  <line x1="350" y1="465" x2="395" y2="465" class="notation-edge"/>
  <text class="small" x="485" y="470">notation expansion</text>
</svg>
